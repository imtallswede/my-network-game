<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-labelledby="title desc"><title id="title">Channel 1 badge</title><desc id="desc">A round badge showing the number 1. Solid fill: one of the three non-overlapping 2.4 GHz channels.</desc><rect x="3" y="3" width="26" height="26" rx="13" fill="#0072B2" stroke="#1F2A44" stroke-width="2.5"/><text x="16" y="21" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" >1</text></svg>
