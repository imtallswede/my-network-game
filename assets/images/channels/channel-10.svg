<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-labelledby="title desc"><title id="title">Channel 10 badge</title><desc id="desc">A round badge showing the number 10. White with a dashed outline: an overlapping channel.</desc><rect x="3" y="3" width="26" height="26" rx="13" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2.5" stroke-dasharray="4 2.5"/><text x="16" y="21" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#1F2A44" text-anchor="middle" >10</text></svg>
